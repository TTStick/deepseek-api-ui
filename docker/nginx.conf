# 反向代理可能终止 TLS（Caddy/Nginx/云负载均衡）；保留原始协议供后端设置 Secure Cookie
map $http_x_forwarded_proto $myagent_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 登录接口限速（应用层还有失败锁定，这里是前置并发/频率保护）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 32m;
    limit_req_status 429;

    # 只信任 Docker 内网前置代理（Caddy）传来的 X-Forwarded-For，防止客户端伪造 IP 绕过登录限速
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 构建产物已是压缩前的哈希文件，开启 gzip 可显著减小传输体积
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self' blob:; child-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: http: blob:; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" always;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 记忆/压缩后端（SSE 长连接：关闭缓冲）
    # 登录接口单独限速，降低并发 scrypt 与暴力破解压力
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $myagent_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $myagent_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 带内容哈希的静态资源可长期缓存。
    # location 内出现 add_header 时不会再继承 server 级响应头，因此这里重复声明安全头。
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self' blob:; child-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: http: blob:; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" always;
    }

    # SPA 入口：不缓存 HTML，其余路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
